<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wellness Guides</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7faf9;
      color: #123c3a;
      margin: 0;
      padding: 40px 20px;
    }
    .wrap {
      max-width: 900px;
      margin: auto;
    }
    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }
    p {
      color: #52666a;
      font-size: 18px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,.06);
      border: 1px solid #dbeee8;
    }
    a {
      display: inline-block;
      margin-top: 15px;
      background: #0f766e;
      color: #fff;
      padding: 12px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Wellness Guides</h1>
    <p>Choose a guide below to learn more.</p>

    <div class="grid">
      <div class="card">
        <h2>Hearing Wellness After 40</h2>
        <p>Daily habits and support options for adults interested in hearing wellness.</p>
        <a href="/hearing-wellness-after-40">Open Guide</a>
      </div>

      <div class="card">
        <h2>Weight Wellness Guide</h2>
        <p>Simple daily habits around hydration, nutrition, and healthy weight support.</p>
        <a href="/weight-wellness-guide">Open Guide</a>
      </div>
    </div>
  </div>
</body>
</html>
